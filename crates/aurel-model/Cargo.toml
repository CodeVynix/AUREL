[package]
name = "aurel-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Model provider abstraction and OpenAI-compatible provider for AUREL"

[lib]
name = "aurel_model"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP only: no async runtime may enter through this dependency.
# rustls = pure-Rust TLS on every platform; json = body helpers.
# (gzip omitted: local endpoints rarely need it. See ADR-0006.)
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
