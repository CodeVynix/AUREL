[package]
name = "aurel-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Read-only core inspection tools for AUREL (files, search, project instructions)"

[lib]
name = "aurel_tools"
path = "src/lib.rs"

[dependencies]
# Only serialization for the model-proposed mutation format below — the
# tools themselves stay dependency-light. Both crates are already in the
# workspace graph (see aurel-model), so this adds edges, not weight.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
