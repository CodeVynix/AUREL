[package]
name = "aurel-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Persistent interactive sessions for AUREL (stable IDs, bounded JSON store)"

[lib]
name = "aurel_session"
path = "src/lib.rs"

[dependencies]
aurel-model = { path = "../aurel-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
