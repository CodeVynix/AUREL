[workspace]
resolver = "2"
members = [
    "crates/aurel-core",
    "crates/aurel-config",
    "crates/aurel-model",
    "crates/aurel-tools",
    "crates/aurel-cli",
]

# Single definition of shared package metadata. Member crates inherit via
# `*.workspace = true` so versions cannot silently drift.
[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
